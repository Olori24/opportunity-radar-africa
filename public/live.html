<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Radar Africa | Live Discovery</title><style>body{margin:0;background:#07101d;color:#eef5ff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px 20px}.card{background:#0e1a2b;border:1px solid #243853;border-radius:20px;padding:24px;margin-bottom:20px}.eyebrow{color:#6ee7b7;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(38px,7vw,70px);line-height:.95;margin:12px 0}p,.meta{color:#9eb0c7;line-height:1.6}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #243853;background:#0a1525;color:#eef5ff;font:inherit}button{margin-top:12px;background:linear-gradient(135deg,#2563eb,#0ea5e9);border:0;font-weight:800;cursor:pointer}.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.check{background:#13243b;padding:9px 12px;border:1px solid #243853;border-radius:10px;color:#c9d6e8}.check input{width:auto}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pill{background:#13243b;padding:12px;border-radius:10px}.pill small{display:block;color:#9eb0c7}.opp{padding:16px 0;border-top:1px solid #243853}.score{color:#6ee7b7;font-weight:900}.link{color:#60a5fa;text-decoration:none}.error{color:#fb7185;margin-top:12px}@media(max-width:700px){.controls,.summary{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><div class="eyebrow">Open Radar Africa · Live Discovery</div><h1>Find opportunities people can actually test.</h1><p>Search the live World Bank procurement feed, then run the results through Open Radar's normalization, deduplication, scoring, ranking and recommendation pipeline.</p><div class="controls"><div><label>Country</label><input id="country" value="Nigeria"></div><div><label>Keyword</label><input id="query" placeholder="digital, energy, health, consulting"></div></div><div class="checks"><label class="check"><input type="checkbox" value="procurement" checked> Procurement</label><label class="check"><input type="checkbox" value="consulting"> Consulting</label><label class="check"><input type="checkbox" value="grant"> Grant</label><label class="check"><input type="checkbox" value="startup"> Startup</label></div><button id="run">Find live opportunities</button><div id="error"></div></div><div class="card"><h2>Results</h2><div id="result"><p>Search to load live results.</p></div></div></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));$('run').onclick=async()=>{const country=$('country').value.trim(),query=$('query').value.trim(),categories=[...document.querySelectorAll('.check input:checked')].map(x=>x.value);$('error').textContent='';$('result').innerHTML='<p>Searching live source...</p>';$('run').disabled=true;try{const r=await fetch('/v1/discover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({country,categories,query,limit:10})});const p=await r.json();if(!r.ok)throw Error(p.error||'Discovery failed');render(p)}catch(e){$('error').textContent=e.message;$('result').innerHTML='<p>Discovery failed.</p>'}finally{$('run').disabled=false}};function render(p){const o=p.opportunities||[],r=p.recommendation||{},e=p.explanation||{};$('result').innerHTML='<div class="summary"><div class="pill"><small>Found</small><b>'+o.length+'</b></div><div class="pill"><small>Recommendation</small><b>'+esc(r.recommendation||'review')+'</b></div><div class="pill"><small>Source</small><b>World Bank Group</b></div></div>'+(r.opportunity?'<div class="opp"><h3>Recommended</h3><b>'+esc(r.opportunity.title)+'</b><div class="meta">'+esc(r.opportunity.organization||'')+' · '+esc(r.opportunity.country||'')+'</div><p>'+esc(r.reason||e.summary||'')+'</p></div>':'')+'<h3>Ranked opportunities</h3>'+o.map((x,i)=>'<div class="opp"><h3>#'+(i+1)+' '+esc(x.title||'Untitled')+' <span class="score">'+esc(x.intelligence_score||'')+'</span></h3><div class="meta">'+esc(x.organization||'')+' · '+esc(x.category||'')+' · deadline '+esc(x.deadline||'unknown')+'</div><p>'+esc(x.description||'')+'</p>'+(x.application_url?'<a class="link" target="_blank" rel="noopener" href="'+esc(x.application_url)+'">Open source notice →</a>':'')+'</div>').join('')+'<div class="opp"><h3>Explanation</h3><p>'+esc(e.summary||'')+'</p></div>'}</script></body></html>
