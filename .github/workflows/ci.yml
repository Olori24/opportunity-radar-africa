name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify source tree
        run: |
          echo "CI commit: $(git rev-parse HEAD)"
          test -f src/open_radar/opportunity_deduplicator.py
          test -f src/open_radar/opportunity_source_registry.py
          PYTHONPATH=src python -c "import open_radar.opportunity_deduplicator as d; print('deduplicator:', d.__file__)"
          PYTHONPATH=src python -c "import open_radar.opportunity_source_registry as r; print('registry:', r.__file__)"

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q
